[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "augmend"
dynamic = ["version"]
description = "Augmentation pipelines for 2D/3D microscopy images"
readme = "Readme.md"
license = "BSD-3-Clause"
authors = [{ name = "Martin Weigert" }, { name = "Uwe Schmidt" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
gpu = ["gputools"]
he = ["scikit-learn"]
test = ["pytest", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/stardist/augmend"

[tool.setuptools.dynamic]
version = { attr = "augmend.version.__version__" }

[tool.setuptools.packages.find]
include = ["augmend*"]

[tool.setuptools.package-data]
augmend = ["transforms/kernels/*.cl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
